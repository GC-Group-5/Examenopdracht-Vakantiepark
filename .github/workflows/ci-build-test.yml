name: CI - build and test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Vakantiepark.slnx

      - name: Build
        run: dotnet build Vakantiepark.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Vakantiepark.slnx --no-build --configuration Release --verbosity normal
